<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Scheduler</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#151b2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scheduler">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --ink:#1a2233; --ink2:#5b6478; --ink3:#8b93a7; --surface:#f4f6fa; --card:#fff;
    --line:#e3e7ef; --brand:#2f4fb0; --brand-soft:#e8edfb;
    --open:#15803d; --open-bg:#e5f6ea; --open-line:#9fd8b0;
    --resv:#1d4ed8; --resv-bg:#e4ecfd; --resv-line:#a9c1f5;
    --full:#697083; --full-bg:#eceef3; --full-line:#d4d8e1;
    --wait:#a16207; --wait-bg:#fdf3d7; --wait-line:#e7cd8a;
    --miss:#b91c1c; --miss-bg:#fdeaea;
    --shadow:0 1px 3px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--surface);color:var(--ink);line-height:1.45;padding-bottom:70px}
  .wrap{max-width:1080px;margin:0 auto;padding:16px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .btn{display:inline-block;border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
  .btn.grey{background:#eceef3;color:var(--ink2)}
  .btn.danger{background:#fff;color:var(--miss);border:1px solid #efb9b9}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 9px}
  .pill.open{background:var(--open-bg);color:var(--open)} .pill.full{background:var(--full-bg);color:var(--full)}
  .pill.wait{background:var(--wait-bg);color:var(--wait)} .pill.type{background:var(--brand-soft);color:var(--brand)}
  .note{font-size:12.5px;color:var(--ink2)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:4px}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:15px;font-family:inherit;background:#fff}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#1a2233;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;z-index:99;max-width:92%;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none}
  header.app{background:#151b2c;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  header.app .t{font-weight:800;font-size:16px} header.app .t small{display:block;font-weight:500;font-size:11.5px;color:#9aa4c0}
  .apphead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:14px 0 12px}
  .who{font-size:17px;font-weight:800} .who small{display:block;font-weight:600;font-size:12px;color:var(--ink2)}
  .score{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;text-align:center;box-shadow:var(--shadow);min-width:118px}
  .score .num{font-size:26px;font-weight:800;color:var(--open);line-height:1.1}
  .score .num.bad{color:var(--miss)}
  .score .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
  .score .thresh{font-size:10.5px;color:var(--ink2);margin-top:3px;max-width:170px}
  .banner{background:var(--brand-soft);border:1px solid #c9d6f5;border-radius:12px;padding:13px 15px;font-size:13.5px;color:#22315e;display:flex;gap:10px;justify-content:space-between;margin-bottom:14px}
  .banner b{display:block;margin-bottom:2px}
  .banner .x{background:none;border:none;font-size:18px;cursor:pointer;color:#5b6aa0}
  .cal-scroll{overflow-x:auto;padding-bottom:6px}
  .cal{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,1fr);gap:9px}
  .day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;min-width:160px}
  .day.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .day h5{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
  .day h5 b{display:block;font-size:15px;color:var(--ink);letter-spacing:0}
  .sess{border-radius:9px;padding:8px 9px;margin-bottom:7px;font-size:12.5px;cursor:pointer;border:1px solid}
  .sess b{display:block} .sess .t{font-size:11px;opacity:.85} .sess .st{font-size:10.5px;font-weight:800}
  .sess.open{background:var(--open-bg);border-color:var(--open-line);color:#0f5e2e}
  .sess.full{background:var(--full-bg);border-color:var(--full-line);color:var(--full)}
  .sess.resv{background:var(--resv-bg);border-color:var(--resv-line);color:#1e3a8a}
  .sess.wait{background:var(--wait-bg);border-color:var(--wait-line);color:var(--wait)}
  .weekbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .weekbar .wk{font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:20px;cursor:pointer;color:var(--ink2)}
  .weekbar .wk.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hist .hrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;background:#fff;margin-bottom:8px}
  .ok{color:var(--open);font-weight:800} .no{color:var(--miss);font-weight:800}
  .modal{position:fixed;inset:0;background:rgba(15,20,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:60}
  .modal.on{display:flex}
  .sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:18px}
  .rrow{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);gap:8px}
  .rrow .nm{font-size:14px;font-weight:600} .rrow .nm small{display:block;font-weight:500;color:var(--ink3);font-size:11.5px}
  .att{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink2)}
  .att.p.on{background:var(--open-bg);border-color:var(--open);color:var(--open)}
  .att.a.on{background:var(--miss-bg);border-color:var(--miss);color:var(--miss)}
  .atabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 14px}
  .atabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
  .atabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
  .kpi .n{font-size:24px;font-weight:800} .kpi .l{font-size:11.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);padding:8px;border-bottom:2px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid var(--line)}
  .tbl-wrap{overflow-x:auto}
  .hero{border-radius:16px;overflow:hidden;position:relative;margin-bottom:14px;background:linear-gradient(135deg,#3b5bcc,#7b93e8)}
  .hero-inner{min-height:170px;display:flex;align-items:flex-end;padding:18px;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.45);background-size:cover;background-position:center}
  .photo-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
  .ph{height:96px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:12.5px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.4);gap:4px;background-size:cover;background-position:center;position:relative;overflow:hidden}
  .ph span{font-size:26px}
  .g1{background:linear-gradient(135deg,#3b5bcc,#7b93e8)} .g2{background:linear-gradient(135deg,#0e8a5f,#5cc79a)}
  .g3{background:linear-gradient(135deg,#b3541e,#e8a06a)} .g4{background:linear-gradient(135deg,#6d3fb8,#a98ae0)}
  .prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .prog{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}
  .prog h4{font-size:15px;margin:6px 0 3px} .prog .meta{font-size:12.5px;color:var(--ink2)}
  .appr{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;background:#fff;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
  .center{max-width:430px;margin:0 auto}
  .ph-edit .rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:12px;cursor:pointer}
  .ph-add{height:96px;border:2px dashed #b9c2d8;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--brand);font-weight:700;font-size:13px;cursor:pointer;background:#fbfcff}
  h3.sec{font-size:15px;margin-bottom:10px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.row2{grid-template-columns:1fr}}
  /* ---- help guide ---- */
  .help-btn{background:#232b44;border:1px solid #39415c;color:#dfe4f2;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer}
  .guide h4{font-size:15px;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
  .guide p,.guide li{font-size:13.5px;color:var(--ink2);margin-bottom:6px}
  .guide ul{padding-left:18px;margin-bottom:4px}
  .guide .chip{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;border:1px solid}
  .guide .c-open{background:var(--open-bg);border-color:var(--open-line);color:#0f5e2e}
  .guide .c-full{background:var(--full-bg);border-color:var(--full-line);color:var(--full)}
  .guide .c-resv{background:var(--resv-bg);border-color:var(--resv-line);color:#1e3a8a}
  .guide .c-wait{background:var(--wait-bg);border-color:var(--wait-line);color:var(--wait)}
  /* ---- tablet / iPad layout (620px and up) ---- */
  @media(min-width:620px){
    .wrap{padding:22px 24px}
    .day{min-width:0;padding:12px}
    .cal{grid-auto-columns:minmax(135px,1fr);gap:11px}
    .sess{font-size:13px;padding:10px}
    .sess .t{font-size:11.5px}
    .day h5 b{font-size:16px}
    .score{min-width:150px;padding:12px 20px}
    .score .num{font-size:30px}
    .hist{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
    .modal{align-items:center;padding:20px}
    .sheet{border-radius:18px;max-height:82vh}
    .prog-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
    .hero-inner{min-height:240px;font-size:18px}
    .photo-strip{grid-template-columns:repeat(4,1fr)}
    .ph{height:120px}
    .kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
    header.app{padding:14px 24px}
    .who{font-size:20px}
  }
  @media(min-width:1100px){
    .cal{grid-auto-columns:minmax(150px,1fr)}
    .hist{grid-template-columns:1fr 1fr 1fr}
  }
</style>
</head>
<body>
<header class="app" id="hdr" style="display:none">
  <div class="t" id="hdrTitle">School Scheduler<small id="hdrSub"></small></div>
  <div style="display:flex;gap:8px">
    <button class="help-btn" onclick="showGuide()">❓ How it works</button>
    <button class="btn sm ghost" style="border-color:#39415c;color:#dfe4f2;background:#232b44" onclick="logout()">Log out</button>
  </div>
</header>
<div class="wrap" id="app"><p class="note" style="padding:30px;text-align:center">Loading…</p></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const $=id=>document.getElementById(id);
const app=$('app');
let ME=null, PUB=null, toastT;
const SLUG=(location.pathname.replace(/\/+$/,'').slice(1)||'').toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',4200)}
function openModal(html){$('sheet').innerHTML=html;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
async function api(url,opts={}){
  const r=await fetch(url,{headers:{'Content-Type':'application/json'},credentials:'same-origin',...opts,
    body:opts.body?JSON.stringify(opts.body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('Error '+r.status));
  return d;
}
const fmtDay=iso=>{const d=new Date(iso+'T12:00');return{dow:d.toLocaleDateString(undefined,{weekday:'short'}),md:d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}};
const todayISO=()=>new Date().toISOString().slice(0,10);
const t12=t=>{let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(m).padStart(2,'0')+ap};

/* ---------- boot ---------- */
async function boot(){
  if(SLUG==='owner'||SLUG==='office'){
    const ov=await api('/api/owner/overview').catch(()=>null);
    if(ov) return renderOwner(ov);
    return renderOwnerLogin();
  }
  try{ ME=await api('/api/me'); }catch{ ME=null; }
  if(!ME){
    if(SLUG && SLUG!=='mockup'){
      PUB=await api('/api/slug/'+SLUG).catch(()=>null);
      if(PUB) return renderLanding();
      toast('That school link was not found.');
      return renderStorefront();
    }
    return renderStorefront();
  }
  $('hdr').style.display='flex';
  $('hdrSub').textContent=ME.school.name;
  if(ME.status!=='approved') return renderPending();
  if(ME.role==='student') return renderStudent();
  if(ME.role==='teacher') return renderTeacher();
  return renderAdmin();
}

/* ---------- storefront (root, no school selected) ---------- */
function renderStorefront(){
  $('hdr').style.display='none';
  app.innerHTML=`
  <div style="text-align:center;padding:34px 10px 22px">
    <div style="font-size:52px">🗓️</div>
    <h1 style="font-size:30px;font-weight:900;margin:10px 0 6px">School Scheduler</h1>
    <p class="note" style="font-size:15px;max-width:520px;margin:0 auto">Classes and afterschool programs, reservations, waitlists,
    and attendance — one simple app for your whole school. Free for up to 3 programs, 3 teachers, and 10 students.</p>
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn" style="font-size:16px;padding:13px 22px" onclick="showRegisterSchool()">🏫 Register your school — free</button>
      <button class="btn ghost" style="font-size:16px;padding:13px 22px" onclick="showLogin()">Log in</button>
    </div>
    <p class="note" style="margin-top:14px">Students & teachers: use the link your school gave you (like <b>${location.host}/your-school</b>).</p>
  </div>
  <div class="prog-grid" style="max-width:860px;margin:10px auto">
    <div class="prog"><h4>🎒 Students</h4><div class="meta">See open spots in green, reserve with one tap, join waitlists, and track your attendance score.</div></div>
    <div class="prog"><h4>📋 Teachers</h4><div class="meta">Your rosters on a calendar, one-tap attendance, and low-attendance flags.</div></div>
    <div class="prog"><h4>🔑 Admins</h4><div class="meta">Approve accounts with ID-photo checks, build your programs, brand your page, set the rules.</div></div>
    <div class="prog"><h4>📱 Works everywhere</h4><div class="meta">Phones, iPads, laptops — students can add it to their home screen like an app.</div></div>
  </div>
  <p class="note" style="text-align:center;margin-top:8px"><a href="#" onclick="showGuide();return false" style="color:var(--brand);font-weight:700">❓ How the app works</a></p>`;
}
function showRegisterSchool(){
  openModal(`<h3 class="sec">Register your school</h3>
  <p class="note" style="margin-bottom:12px">Takes one minute. You'll get a private link for your school and an admin account — free plan, no card needed.</p>
  <div class="field"><label>School name</label><input id="rs_name" placeholder="e.g. Patriots High School"></div>
  <div class="field"><label>District / tagline (optional)</label><input id="rs_sub" placeholder="e.g. Mission, Texas · Home of the Patriots"></div>
  <div class="row2"><div class="field"><label>Your name</label><input id="rs_admin"></div>
  <div class="field"><label>Your email</label><input id="rs_email" type="email"></div></div>
  <div class="field"><label>Password</label><input id="rs_pass" type="password"></div>
  <button class="btn" onclick="doRegisterSchool()">Create my school</button>`);
}
async function doRegisterSchool(){
  try{
    const d=await api('/api/register-school',{method:'POST',body:{school_name:$('rs_name').value,subtitle:$('rs_sub').value,
      admin_name:$('rs_admin').value,admin_email:$('rs_email').value,admin_password:$('rs_pass').value}});
    location.href='/'+d.slug+'?welcome=1';
  }catch(e){toast(e.message)}
}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}

/* ---------- per-school landing (/<slug>) ---------- */
async function renderLanding(){
  $('hdr').style.display='none';
  const pub=PUB;
  const grads=['g2','g3','g4','g1'];
  app.innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:6px 2px 14px">
    <div><div style="font-size:22px;font-weight:800">${esc(pub.school.name)}</div>
    <div class="note">${esc(pub.school.subtitle)}</div></div>
    <div><button class="btn" onclick="showLogin()">Log In</button>
    <button class="btn ghost" onclick="showSignup()">Sign Up</button></div>
  </div>
  <div class="hero"><div class="hero-inner" ${pub.photos[0]?`style="background-image:url(${pub.photos[0].data})"`:''}>
    Reserve your spot for classes &amp; afterschool programs</div></div>
  ${pub.photos.length>1?`<div class="photo-strip">${pub.photos.slice(1,5).map(p=>
    `<div class="ph" style="background-image:url(${p.data})"><span></span>${esc(p.caption)}</div>`).join('')}</div>`:
   `<div class="photo-strip">${pub.programs.slice(0,4).map((p,i)=>
    `<div class="ph ${grads[i%4]}"><span>${p.emoji}</span>${esc(p.name)}</div>`).join('')}</div>`}
  <div class="card"><h3 class="sec">This season's programs</h3>
    <div class="prog-grid">${pub.programs.map(p=>`
      <div class="prog"><span class="pill type">${p.type==='class'?'Class':'Afterschool'}</span>
      <h4>${p.emoji} ${esc(p.name)}</h4>
      <div class="meta">${daysLabel(p.days)} · ${t12(p.time_start)}–${t12(p.time_end)}<br>
      ${esc(p.date_start)} → ${esc(p.date_end)} · ${esc(p.room)}${p.teacher?' · '+esc(p.teacher):''}</div></div>`).join('')||'<p class="note">No programs yet.</p>'}
    </div></div>
  <p class="note">New here? <b>Sign Up</b> — an administrator approves your account before you can reserve or teach.
  &nbsp;·&nbsp; <a href="#" onclick="showGuide();return false" style="color:var(--brand);font-weight:700">❓ How the app works</a></p>`;
  if(location.search.includes('welcome=1')){history.replaceState({},'','/'+SLUG);
    setTimeout(()=>toast('🎉 Your school is live! This page is your school\'s private link — share it with students and teachers. Log in to start adding programs.'),600);}
}
const daysLabel=days=>days.split(',').map(n=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][+n]).join(' & ');

function showLogin(){
  openModal(`<h3 class="sec">Log in</h3>
  <div class="field"><label>Email</label><input id="li_email" type="email" autocomplete="username"></div>
  <div class="field"><label>Password</label><input id="li_pass" type="password" autocomplete="current-password"></div>
  <button class="btn" onclick="doLogin()">Log in</button>
  <p class="note" style="margin-top:10px"><a href="#" onclick="showForgot();return false" style="color:var(--brand);font-weight:700">Forgot password?</a></p>`);
}
async function doLogin(){
  try{await api('/api/login',{method:'POST',body:{email:$('li_email').value,password:$('li_pass').value}});
    closeModal();boot();}catch(e){toast(e.message)}
}
function showSignup(){
  if(!PUB) return toast('Open your school\'s link first (like '+location.host+'/your-school), then sign up there.');
  openModal(`<h3 class="sec">Create an account · ${esc(PUB.school.name)}</h3>

let ID_PHOTO='';
function pickIdPhoto(input){
  const f=input.files[0]; if(!f) return;
  const img=new Image(); const rd=new FileReader();
  rd.onload=()=>{ img.onload=()=>{
    const max=1200, sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    ID_PHOTO=c.toDataURL('image/jpeg',0.82);
    $('su_idpreview').innerHTML=`<img src="${ID_PHOTO}" style="max-width:160px;border-radius:10px;border:1px solid var(--line)"> <span class="note">Looks good ✔</span>`;
  }; img.src=rd.result; };
  rd.readAsDataURL(f);
}

/* ---------- student ---------- */
let weekOffset=0;
async function renderStudent(){
  const from=new Date();from.setDate(from.getDate()+weekOffset*7);
  const cal=await api('/api/student/calendar?from='+from.toISOString().slice(0,10)+'&days=7');
  const hist=await api('/api/student/history');
  const st=cal.settings;
  const below=cal.stats.pct<st.threshold;
  const seen=localStorage.getItem('welcomed');
  app.innerHTML=`
  <div class="apphead"><div class="who">Hi, ${esc(ME.name.split(' ')[0])} 👋<small>${esc(ME.school.name)}</small></div>
    <div class="score"><div class="num ${below?'bad':''}">${cal.stats.pct}%</div><div class="lbl">✔ Attendance</div>
    <div class="thresh">Below <b>${st.threshold}%</b> booking is limited to waitlist-only</div></div></div>
  ${!seen?`<div class="banner"><div><b>Welcome! Here's how it works.</b>Pick classes and afterschool programs below and reserve a spot.
   <span style="color:var(--open);font-weight:700">Green = open, tap to reserve.</span> Grey = full, tap to join the waitlist.
   Reservations are locked in unless you cancel.</div>
   <button class="x" onclick="localStorage.setItem('welcomed','1');this.parentElement.remove()">✕</button></div>`:''}
  ${below?`<div class="banner" style="background:var(--miss-bg);border-color:#efb9b9;color:#7a1f1f"><div><b>Attendance limitation active.</b>
   Your attendance is ${cal.stats.pct}%, below the ${st.threshold}% threshold — you can only join waitlists until it improves.</div></div>`:''}
  <div class="weekbar">
    <button class="wk ${weekOffset===0?'on':''}" onclick="weekOffset=0;renderStudent()">This Week</button>
    <button class="wk ${weekOffset===1?'on':''}" onclick="weekOffset=1;renderStudent()">Next Week</button>
    ${weekOffset>1?`<button class="wk on">+${weekOffset} weeks</button>`:''}
    <button class="wk" onclick="weekOffset++;renderStudent()">▸ Later</button>
  </div>
  <div class="cal-scroll"><div class="cal">${calDays(cal,true)}</div></div>
  <div class="card" style="margin-top:14px"><h3 class="sec">Your past sessions <span class="note">(✔ attended · ✘ no-show)</span></h3>
  <div class="hist">${hist.history.map(h=>`<div class="hrow"><span>${fmtDay(h.date).dow} ${fmtDay(h.date).md} · ${h.emoji} ${esc(h.name)}</span>
    ${h.attended===1?'<span class="ok">✔ Attended</span>':h.attended===0?'<span class="no">✘ No-show</span>':'<span class="note">— not recorded</span>'}</div>`).join('')||'<p class="note">Nothing yet — your history appears after your first session.</p>'}</div></div>`;
}
function calDays(cal,student){
  const out=[];const d=new Date(cal.from+'T12:00');
  for(let i=0;i<7;i++){
    const iso=d.toISOString().slice(0,10);const f=fmtDay(iso);
    const sessions=cal.days[iso]||[];
    out.push(`<div class="day ${iso===todayISO()?'today':''}"><h5>${f.dow}${iso===todayISO()?' · Today':''}<b>${f.md}</b></h5>
    ${sessions.map(s=>student?studentChip(s,iso):teacherChip(s,iso)).join('')||'<p class="note" style="padding:4px">No sessions</p>'}</div>`);
    d.setDate(d.getDate()+1);
  }
  return out.join('');
}
function studentChip(s,date){
  const base=`<b>${s.emoji} ${esc(s.name)}</b><span class="t">${t12(s.time_start)}–${t12(s.time_end)} · ${esc(s.room)}</span>`;
  const past=date<todayISO();
  if(s.mine==='reserved') return `<div class="sess resv" onclick="${past?'':`cancelRes(${s.program_id},'${date}')`}">${base}<span class="st">🔒 RESERVED${past?'':' — tap to cancel'}</span></div>`;
  if(s.mine==='waitlist') return `<div class="sess wait" onclick="${past?'':`cancelRes(${s.program_id},'${date}')`}">${base}<span class="st">⏳ WAITLISTED — tap to leave</span></div>`;
  if(past) return '';
  if(s.open>0) return `<div class="sess open" onclick="reserve(${s.program_id},'${date}')">${base}<span class="st">● OPEN · ${s.open} spot${s.open===1?'':'s'} — tap to reserve</span></div>`;
  return `<div class="sess full" onclick="reserve(${s.program_id},'${date}')">${base}<span class="st">⊘ FULL — tap to join waitlist${s.waitlist?` (${s.waitlist} waiting)`:''}</span></div>`;
}
async function reserve(pid,date){
  try{const d=await api('/api/student/reserve',{method:'POST',body:{program_id:pid,date}});
    toast(d.status==='reserved'?'Reserved! Your spot is locked in unless you cancel.':'Added to the waitlist at position #'+d.position+'. You are promoted automatically if a spot opens.');
    renderStudent();}catch(e){toast('⛔ '+e.message)}
}
async function cancelRes(pid,date){
  if(!confirm('Cancel this reservation?'))return;
  try{const d=await api('/api/student/cancel',{method:'POST',body:{program_id:pid,date}});
    toast('Cancelled.'+(d.promoted?' '+d.promoted+' was promoted from the waitlist.':''));renderStudent();}catch(e){toast(e.message)}
}

function teacherChip(s,date){
  const base=`<b>${s.emoji} ${esc(s.name)}</b><span class="t">${t12(s.time_start)}–${t12(s.time_end)} · ${esc(s.room)}</span>`;
  const cls=s.attendanceDone?'resv':(s.reserved>=s.capacity?'open':date===todayISO()?'wait':'full');
  const label=s.attendanceDone?`✔ ATTENDANCE DONE ${s.reserved}/${s.capacity}`:
    date===todayISO()?`⏰ TODAY ${s.reserved}/${s.capacity} — tap for attendance`:
    `${s.reserved}/${s.capacity} enrolled${s.reserved>=s.capacity?' · FULL':''}${s.waitlist?' · waitlist '+s.waitlist:''}`;

let ATT={};
async function openRoster(pid,date){
  const d=await api(`/api/teacher/roster?program_id=${pid}&date=${date}`);
  ATT={};
  const f=fmtDay(date);
  openModal(`<div style="display:flex;justify-content:space-between;align-items:center">
  <h3 class="sec">${esc(d.program)} — ${f.dow} ${f.md}</h3>
  <button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="closeModal()">✕</button></div>
  <p class="note" style="margin-bottom:8px">${d.roster.filter(r=>r.status==='reserved').length} of ${d.capacity} enrolled ·
  <span id="attCount"><b>0</b> marked</span></p>
  <div id="rosterRows">${d.roster.filter(r=>r.status==='reserved').map(r=>`
    <div class="rrow"><div class="nm">${esc(r.name)}${r.attendance_pct<80?' <span class="pill wait">⚠ '+r.attendance_pct+'%</span>':''}
      <small>ID ${esc(r.id_number||'—')} · Grade ${esc(r.grade||'—')} · ${r.attendance_pct}% attendance${r.attended!==null?' · already marked '+(r.attended?'present':'absent'):''}</small></div>
      <div style="display:flex;gap:6px">
      <button class="att p ${r.attended===1?'on':''}" onclick="mark(this,${r.student_id},1)">✔ Present</button>
      <button class="att a ${r.attended===0?'on':''}" onclick="mark(this,${r.student_id},0)">✘ Absent</button></div></div>`).join('')||'<p class="note">No students enrolled yet.</p>'}
  </div>
  ${d.roster.some(r=>r.status==='waitlist')?`<p class="note" style="margin-top:10px"><b>Waitlist:</b> ${d.roster.filter(r=>r.status==='waitlist').map(r=>esc(r.name)).join(', ')}</p>`:''}
  ${ME.role==='teacher'&&date<=todayISO()?`<div style="margin-top:14px"><button class="btn" onclick="saveAttendance(${pid},'${date}',${d.roster.filter(r=>r.status==='reserved').length})">Save attendance</button></div>`:
   `<p class="note" style="margin-top:12px">Attendance opens on the day of the session.</p>`}`);
  d.roster.filter(r=>r.status==='reserved'&&r.attended!==null).forEach(r=>ATT[r.student_id]=r.attended===1);
  updCount();
}
function mark(btn,sid,present){
  btn.parentElement.querySelectorAll('.att').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');ATT[sid]=!!present;updCount();
}
function updCount(){const el=$('attCount');if(el)el.innerHTML='<b>'+Object.keys(ATT).length+'</b> marked'}
async function saveAttendance(pid,date,total){
  const records=Object.entries(ATT).map(([student_id,present])=>({student_id:+student_id,present}));
  if(records.length<total) return toast('⚠ '+(total-records.length)+' student(s) unmarked — mark everyone before saving.');
  try{await api('/api/teacher/attendance',{method:'POST',body:{program_id:pid,date,records}});
    closeModal();toast('Attendance saved — students see ✔ / ✘ on their history.');renderTeacher();}catch(e){toast(e.message)}
}

/* ---------- bulk selection & removal ---------- */
const SEL={student:new Set(),teacher:new Set()};
function rowCheck(role,id){
  return `<input type="checkbox" ${SEL[role].has(id)?'checked':''} onclick="toggleSel('${role}',${id})" style="width:16px;height:16px;cursor:pointer">`;
}
function headCheck(role,users){
  const ids=users.filter(u=>u.role===role).map(u=>u.id);
  const all=ids.length&&ids.every(i=>SEL[role].has(i));
  return `<input type="checkbox" ${all?'checked':''} onclick="toggleAll('${role}',[${ids}])" title="Select all" style="width:16px;height:16px;cursor:pointer">`;
}
function selBar(role){
  const n=SEL[role].size;
  if(!n) return '';
  return `<button class="btn sm danger" style="margin-right:6px" onclick="removeSelected('${role}')">🗑 Remove ${n} selected</button>
    <button class="btn sm grey" style="margin-right:6px" onclick="SEL.${role}.clear();renderAdmin()">Clear</button>`;
}
function toggleSel(role,id){ SEL[role].has(id)?SEL[role].delete(id):SEL[role].add(id); renderAdmin(); }
function toggleAll(role,ids){
  const all=ids.length&&ids.every(i=>SEL[role].has(i));
  if(all) SEL[role].clear(); else ids.forEach(i=>SEL[role].add(i));
  renderAdmin();
}
async function removeSelected(role){
  const ids=[...SEL[role]];
  const what=role==='student'?'student':'teacher';
  const warn=role==='student'
    ? `Removing ${ids.length} ${what}${ids.length===1?'':'s'} also deletes their reservations and attendance history.`
    : `Removing ${ids.length} ${what}${ids.length===1?'':'s'} unassigns them from their programs. The programs stay — you can assign someone else.`;
  if(!confirm(`${warn}\n\nThis cannot be undone. Continue?`))return;
  try{
    const d=await api('/api/admin/people/remove',{method:'POST',body:{ids}});
    SEL[role].clear(); toast(d.message); renderAdmin();
  }catch(e){toast(e.message)}
}

async function submitList(){
  const text=$('ap_text').value;

    const d=await api('/api/admin/people/bulk',{method:'POST',body:{role:PPL.role,text}});
    closeModal();

    if(d.invited) m+=` · ${d.invited} invite${d.invited===1?'':'s'} emailed`;

  const k=ov.kpis;
  const planChip=s=>s.plan==='pro'?(s.plan_expires?`<span class="pill wait">⏳ trial → ${s.plan_expires}</span>`:'<span class="pill open">✨ paid</span>'):'<span class="pill full">free</span>';
  const isNew=s=>s.created&&s.created.slice(0,10)>=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  OV=ov;
  app.innerHTML=`
  <div class="apphead"><div class="who">Mission Control<small>All schools · alerts · support</small></div>
    <button class="btn sm ghost" onclick="boot()">↻ Refresh</button></div>
  <div class="atabs">
    <button class="${otab==='dash'?'on':''}" onclick="otab='dash';renderOwner(OV)">📊 Overview</button>
    <button class="${otab==='setup'?'on':''}" onclick="otab='setup';renderOwner(OV)">🔑 Logins & setup</button>
  </div>
  <div id="opane"></div>`;
  if(otab==='setup') return drawOwnerSetup();
  $('opane').innerHTML=`
  <div class="kpis">
    <div class="kpi"><div class="n">${k.total}</div><div class="l">Schools</div></div>
    <div class="kpi"><div class="n" style="color:var(--open)">${k.newWeek}</div><div class="l">New this week</div></div>
    <div class="kpi"><div class="n">${k.paid}</div><div class="l">Paid</div></div>
    <div class="kpi"><div class="n" style="color:var(--wait)">${k.trials}</div><div class="l">Active trials</div></div>
    <div class="kpi"><div class="n">${k.students}</div><div class="l">Students total</div></div>
    <div class="kpi"><div class="n" style="color:${k.openSupport?'var(--miss)':'var(--ink)'}">${k.openSupport}</div><div class="l">Open support</div></div>
  </div>
  <div class="card"><b style="font-size:14px">🔔 Alerts</b>
    ${ov.alerts.length?ov.alerts.map(a=>`<div class="hrow" style="margin-top:8px"><span style="font-size:13px">${esc(a.text)}</span><span class="note">${(a.when||'').slice(0,10)}</span></div>`).join(''):'<p class="note" style="margin-top:6px">Quiet for now — new schools, expiring trials, and open support show up here.</p>'}
  </div>
  <div class="card"><b style="font-size:14px">🏫 Schools</b>
    <div class="tbl-wrap" style="margin-top:8px"><table>
      <tr><th>School</th><th>Plan</th><th>Programs</th><th>Teachers</th><th>Students</th><th>Admin</th><th>Registered</th></tr>
      ${ov.schools.map(s=>`<tr>
        <td><b>${esc(s.name)}</b>${isNew(s)?' <span class="pill open">NEW</span>':''}<br><a href="/${s.slug}" target="_blank" style="font-size:11.5px;color:var(--brand)">/${s.slug}</a></td>
        <td>${planChip(s)}</td><td>${s.programs}</td><td>${s.teachers}</td><td>${s.students}</td>
        <td style="font-size:12px">${esc(s.admin_name||'—')}<br><span class="note">${esc(s.admin_email||'')}</span></td>
        <td class="note">${(s.created||'').slice(0,10)}<br><button class="btn sm grey" onclick="ownerResetPw(${s.id},'${esc(s.name)}')">Reset admin PW</button></td></tr>`).join('')}
    </table></div></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <b style="font-size:14px">📧 Email service</b><span id="em_status" class="pill full">checking…</span></div>
    <p class="note" style="margin:6px 0 8px">Sends password-reset links. Configure with GMAIL_USER / GMAIL_APP_PASSWORD (or EMAIL_USER / EMAIL_PASSWORD) env vars in Render.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="em_to" placeholder="send test to…" style="flex:1;min-width:180px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px">
    <button class="btn sm" onclick="testEmail()">Send test</button></div></div>
  <div class="card"><b style="font-size:14px">🔑 Trial code generator</b>
    <p class="note" style="margin:4px 0 10px">Mint single-use codes that unlock the full Unlimited plan for a set time, then auto-revert the school to Free. Hand one to a school to start their trial.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="field" style="margin:0"><label>Trial length</label>
        <select id="gc_days"><option value="14">14 days</option><option value="30" selected>30 days</option>
        <option value="60">60 days</option><option value="90">90 days</option><option value="180">180 days</option><option value="365">1 year</option></select></div>
      <div class="field" style="margin:0"><label>How many</label><input id="gc_count" type="number" value="3" min="1" max="50" style="max-width:90px"></div>
      <button class="btn" onclick="genCodes()">Generate</button>
    </div>
    <div id="gc_out" style="margin-top:12px"></div>
  </div>
  <div class="card"><b style="font-size:14px">🛟 Support inbox</b>
    ${ov.support.length?ov.support.map(m=>`
      <div class="appr" style="margin-top:8px;${m.status==='open'?'':'opacity:.55'}">
        <div style="flex:1"><b>${esc(m.school||'?')}</b> <span class="note">· ${esc(m.user_name||'')} &lt;${esc(m.user_email||'')}&gt; · ${(m.created||'').slice(0,16)}</span>
        <div style="font-size:13.5px;margin-top:4px">${esc(m.message)}</div></div>
        ${m.status==='open'?`<button class="btn sm" onclick="closeTicket(${m.id})">Mark resolved</button>`:'<span class="pill open">resolved</span>'}
      </div>`).join(''):'<p class="note" style="margin-top:6px">No support messages yet. School admins send them from their console.</p>'}
  </div>
  <p class="note">Reply to support by emailing the address shown — replies aren't sent from inside the app (yet).</p>`;
  loadEmailStatus();
}
let OV=null, otab='dash';

/* ---------- owner: logins & setup ---------- */
async function drawOwnerSetup(){
  const p=$('opane'); p.innerHTML='<p class="note">Loading…</p>';
  let d; try{ d=await api('/api/owner/setup'); }catch(e){ p.innerHTML='<p class="note">'+esc(e.message)+'</p>'; return; }
  const warnings=d.env.filter(e=>!e.ok&&/OWNER_PASSWORD|JWT_SECRET|CODE_SECRET|DB_PATH/.test(e.key));
  const row=(label,val,note)=>`<div class="hrow" style="margin-bottom:8px"><span><b>${esc(label)}</b>${note?`<br><span class="note">${note}</span>`:''}</span>
    <span style="display:flex;align-items:center;gap:8px"><code style="font-family:ui-monospace,Menlo,monospace;font-size:13px">${esc(val)}</code>
    <button class="btn sm grey" onclick="navigator.clipboard.writeText('${esc(val)}');toast('Copied')">Copy</button></span></div>`;
  p.innerHTML=`
  ${warnings.length?`<div class="banner" style="background:var(--miss-bg);border-color:#efb9b9;color:#7a1f1f">
    <div><b>${warnings.length} thing${warnings.length===1?'':'s'} still on default settings</b>
    ${warnings.map(w=>`<div style="margin-top:3px">• <b>${esc(w.key)}</b> — ${esc(w.warn)}</div>`).join('')}
    <div style="margin-top:6px">Fix in Render → your service → Environment.</div></div></div>`:
    `<div class="banner" style="background:var(--open-bg);border-color:var(--open-line);color:#0f5e2e"><div><b>✓ Secrets look properly configured.</b></div></div>`}

  <div class="card"><b style="font-size:14px">🔐 Your office login</b>
    <p class="note" style="margin:4px 0 10px">This console. Separate from every school — school admins cannot reach it.</p>
    ${row('Office URL', d.urls.office)}
    ${row('Email', d.owner.email, d.owner.usingDefaultEmail?'Default — change OWNER_EMAIL in Render':'')}
    <div class="hrow"><span><b>Password</b><br><span class="note">${d.owner.usingDefaultPassword
      ?'<span style="color:var(--miss);font-weight:700">Still the default (owner123) — change OWNER_PASSWORD today</span>'
      :'Set via OWNER_PASSWORD — not shown here'}</span></span><span class="note">••••••••</span></div>
  </div>

  <div class="card"><b style="font-size:14px">🧪 Test accounts</b>
    <p class="note" style="margin:4px 0 10px">${d.demo.slug
      ? 'Seeded demo school for showing the product. Delete these before a real school uses this instance.'
      : 'The demo school is no longer present on this instance.'}</p>
    ${d.demo.slug?row('Demo school link', d.urls.demo):''}
    <div class="tbl-wrap" style="margin-top:6px"><table>
      <tr><th>Role</th><th>Email</th><th>Password</th><th></th></tr>
      ${d.demo.accounts.map(a=>`<tr${a.exists?'':' style="opacity:.45"'}>
        <td>${esc(a.role)}</td>
        <td style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px">${esc(a.email)}</td>
        <td style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px">${a.exists?esc(a.password):'—'}</td>
        <td>${a.exists?`<button class="btn sm grey" onclick="navigator.clipboard.writeText('${esc(a.email)}');toast('Email copied')">Copy</button>`:'<span class="pill full">removed</span>'}</td>
      </tr>`).join('')}
    </table></div>
    <p class="note" style="margin-top:8px">Passwords shown are the seeded ones — if someone changed them in the app, use Reset PW instead.</p>
  </div>

  <div class="card"><b style="font-size:14px">⚙️ Instance checklist</b>
    <p class="note" style="margin:4px 0 10px">What's switched on. Values are never shown — only whether each is configured.</p>
    ${d.env.map(e=>`<div class="hrow" style="margin-bottom:6px">
      <span><b>${esc(e.label)}</b><br><span class="note"><code style="font-size:11.5px">${esc(e.key)}</code>${e.ok?'':' — '+esc(e.warn)}</span></span>
      <span class="pill ${e.ok?'open':'wait'}">${e.ok?'✓ set':'not set'}</span></div>`).join('')}
  </div>

  <div class="card"><b style="font-size:14px">🔗 Links</b>
    ${row('Storefront (public)', d.urls.storefront)}
    ${d.urls.demo?row('Demo school', d.urls.demo):''}
    ${row('Your office', d.urls.office)}
    <p class="note" style="margin-top:8px">Give a school only their own link. Never share your office URL, access-code secret, or any Render environment value.</p>
  </div>`;
}
async function loadEmailStatus(){
  const el=$('em_status'); if(!el) return;
  const s=await api('/api/owner/emailstatus').catch(()=>({enabled:false}));
  el.className='pill '+(s.enabled?'open':'wait');
  el.textContent=s.enabled?('✔ on via '+s.via+' ('+s.from+')'):'⚠ not configured';
}
async function testEmail(){
  try{const d=await api('/api/owner/testemail',{method:'POST',body:{to:$('em_to').value}});toast(d.message);}catch(e){toast(e.message)}
}
async function genCodes(){
  try{
    const d=await api('/api/owner/gencodes',{method:'POST',body:{days:+$('gc_days').value,count:+$('gc_count').value}});
    $('gc_out').innerHTML=d.codes.map(c=>`
      <div class="hrow" style="font-family:ui-monospace,Menlo,monospace;font-weight:700">
        <span>${c}<small style="display:block;font-weight:500;color:var(--ink3);font-family:inherit">${d.days}-day trial · single use</small></span>
        <button class="btn sm grey" onclick="navigator.clipboard.writeText('${c}');this.textContent='✓';setTimeout(()=>this.textContent='Copy',1200)">Copy</button>
      </div>`).join('');
  }catch(e){toast(e.message)}
}
async function ownerResetPw(sid,name){
  if(!confirm('Reset the admin password for '+name+'?'))return;
  try{const d=await api('/api/owner/resetpw',{method:'POST',body:{school_id:sid}});
    openModal(`<h3 class="sec">Temp password — ${esc(d.name)} (${esc(name)})</h3>
    <div class="hrow" style="font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:18px"><span>${d.temp}</span>
    <button class="btn sm grey" onclick="navigator.clipboard.writeText('${d.temp}');toast('Copied')">Copy</button></div>
    <p class="note" style="margin-top:10px">Send it to ${esc(d.email)}. It won't be shown again.</p>
    <button class="btn" style="margin-top:8px" onclick="closeModal()">Done</button>`);
  }catch(e){toast(e.message)}
}
async function closeTicket(id){
  try{await api('/api/owner/support/'+id+'/close',{method:'POST'});toast('Marked resolved.');boot();}catch(e){toast(e.message)}
}

/* ---------- how it works guide ---------- */
function showGuide(){
  const role=ME?ME.role:null;
  const student=`<h4>🎒 For students</h4>
  <p>Your calendar shows this week and next (tap <b>▸ Later</b> to look ahead). Each colored box is one session:</p>
  <ul>
    <li><span class="chip c-open">Green — OPEN</span> has spots left. Tap it to <b>reserve</b>.</li>
    <li><span class="chip c-full">Grey — FULL</span> has no spots. Tap it to join the <b>waitlist</b> — if someone cancels, the first person in line is moved in automatically.</li>
    <li><span class="chip c-resv">Blue — RESERVED</span> is yours, locked in unless you tap it to cancel.</li>
    <li><span class="chip c-wait">Gold — WAITLISTED</span> means you're in line; tap to leave the list.</li>
  </ul>
  <p>You can sign up for as many programs as you like inside the booking window, but the app <b>blocks overlapping times</b> — cancel one before reserving another at the same time.</p>
  <p><b>Attendance score</b> (top right): after each session your teacher marks you present ✔ or absent ✘, and past sessions appear in your history. If your score falls below the school's threshold, booking becomes <b>waitlist-only</b> until it improves — so show up to what you reserve, or cancel ahead of time!</p>`;
  const teacher=`<h4>📋 For teachers</h4>
  <p>Your calendar shows only the sessions you teach, with enrollment counts — <b>FULL</b> is flagged, and today's sessions are highlighted.</p>
  <p>Tap any session to open its <b>roster</b>: every enrolled student with their attendance percentage (low attenders are flagged ⚠), plus the waitlist. On the day of class, mark <b>every</b> student ✔ Present or ✘ Absent — the app won't save a partial list. Those marks feed each student's history and score, which is the school's official record.</p>`;
  const admin=`<h4>🔑 For administrators</h4>
  <ul>
    <li><b>Approvals</b> — students and teachers create their own accounts, but nothing works until you approve them here.</li>
    <li><b>Admin</b> — three lists you own: Programs & Classes (create each one as a "class" or "afterschool program" with days, times, date range, room, capacity, and teacher), Students, and Teachers.</li>
    <li><b>Branding</b> — rename the school and upload the photos shown on the public landing page (first photo = hero image).</li>
    <li><b>Settings</b> — the booking window (default 14 days), the attendance threshold, what happens below it, and waitlist auto-promotion.</li>
  </ul>`;
  const start=`<h4>🚀 Getting started</h4>
  <p>Everyone starts on the public page: tap <b>Sign Up</b>, pick your school and role, and create an account. A school administrator then approves it — until they do, you'll see a "waiting for approval" screen. Once approved, log in any time from any device; the app works on phones, tablets, and computers.</p>`;
  openModal(`<div class="guide" style="max-width:560px">
  <div style="display:flex;justify-content:space-between;align-items:center">
  <h3 class="sec" style="margin:0">How the app works</h3>
  <button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="closeModal()">✕</button></div>
  ${role==='student'?student:''}
  ${role==='teacher'?teacher+student.replace('<h4>🎒 For students</h4>','<h4>🎒 What students see</h4>'):''}
  ${role==='admin'?admin+student+teacher:''}
  ${!role?start+student:''}
  <p style="margin-top:14px"><button class="btn" onclick="closeModal()">Got it</button></p></div>`);
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
if(location.search.includes('upgraded=1')){history.replaceState({},'','/');setTimeout(()=>toast('🎉 Subscription active — your school is now on the Unlimited plan.'),800);}
const _rt=new URLSearchParams(location.search).get('reset');
if(_rt) setTimeout(()=>showResetForm(_rt),400);
boot();
</script>
</body>
